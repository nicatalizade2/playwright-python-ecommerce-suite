version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: postgres_db_demo
    environment:
      POSTGRES_USER: qa_user
      POSTGRES_PASSWORD: qa_password
      POSTGRES_DB: demoblaze_mock
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qa_user -d demoblaze_mock"]
      interval: 5s
      timeout: 5s
      retries: 5

  playwright-tests:
    build: .
    depends_on:
      db:
        condition: service_healthy  # Ensures DB is ready before tests run
    environment:
      - DB_HOST=db
      - DB_NAME=demoblaze_mock
      - DB_USER=qa_user
      - DB_PASS=qa_password
    volumes:
      - ./test-results:/app/test-results
